      環境変数化は行わない（バックエンドを持たない静的SPAで、これ自体が公開情報そのもの）。
    -->

    <meta property="og:url" content="https://n-yata.github.io/soccer-sim/" />
    <meta property="og:site_name" content="フォーメーションラボ" />
